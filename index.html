<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr. Renel Jay Quirit – Regional IT Officer</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f6f8fb;
        --card: #fff;
        --ink: #14213d;
        --mute: #5b6678;
        --line: #e3e8ef;
        --brand: #1f3a5f;
        --accent: #e07a1f;
        --soft: #eaf0f8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1522;
          --card: #161f31;
          --ink: #e8edf5;
          --mute: #9aa7bb;
          --line: #26324a;
          --brand: #7fb0ff;
          --accent: #f0a050;
          --soft: #1c2840;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1522;
        --card: #161f31;
        --ink: #e8edf5;
        --mute: #9aa7bb;
        --line: #26324a;
        --brand: #7fb0ff;
        --accent: #f0a050;
        --soft: #1c2840;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 70px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.6 -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      a {
        color: var(--brand);
      }
      nav {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 4px;
        padding: 10px 16px;
        overflow-x: auto;
        white-space: nowrap;
      }
      nav a {
        text-decoration: none;
        color: var(--mute);
        font-size: 14px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 99px;
      }
      nav a:hover {
        background: var(--soft);
        color: var(--brand);
      }
      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 20px;
      }
      header {
        background: linear-gradient(120deg, #1f3a5f, #2c5282, #1f3a5f);
        color: #fff;
        padding: 56px 0 48px;
      }
      header .wrap {
        display: flex;
        gap: 28px;
        align-items: center;
        flex-wrap: wrap;
      }
      .avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        object-fit: cover;
        border: 3px solid var(--accent);
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.15;
      }
      .role {
        color: #ffd9b0;
        font-weight: 600;
        margin: 6px 0;
      }
      header p {
        max-width: 62ch;
        margin: 10px 0;
        color: #e3ecf8;
      }
      .cta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .btn {
        display: inline-block;
        padding: 9px 18px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        background: var(--accent);
        color: #fff;
      }
      .btn.o {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 14px;
        margin-top: -30px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      }
      .stat b {
        display: block;
        font-size: 26px;
        color: var(--brand);
      }
      .stat span {
        font-size: 13px;
        color: var(--mute);
      }
      section {
        padding: 40px 0 0;
      }
      h2 {
        font-size: 22px;
        margin: 0 0 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h2:before {
        content: "";
        width: 5px;
        height: 22px;
        background: var(--accent);
        border-radius: 3px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
      }
      .tl {
        border-left: 2px solid var(--line);
        margin-left: 6px;
        padding-left: 22px;
      }
      .job {
        position: relative;
        margin-bottom: 18px;
      }
      .job:before {
        content: "";
        position: absolute;
        left: -30px;
        top: 24px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        border: 3px solid var(--bg);
      }
      .job h3 {
        margin: 0;
        font-size: 18px;
      }
      .job .org {
        color: var(--brand);
        font-weight: 600;
      }
      .job .meta {
        color: var(--mute);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .job ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      .job li {
        margin: 4px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
        gap: 16px;
      }
      .skill {
        margin: 10px 0;
      }
      .skill div {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .bar {
        height: 6px;
        background: var(--soft);
        border-radius: 4px;
        margin-top: 4px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--brand), var(--accent));
        border-radius: 4px;
      }
      .card h4 {
        margin: 0 0 8px;
        color: var(--brand);
        font-size: 15px;
      }
      .proj {
        text-decoration: none;
        color: inherit;
        transition: transform 0.15s;
      }
      .proj:hover {
        transform: translateY(-3px);
      }
      .proj b {
        color: var(--brand);
      }
      .proj small {
        color: var(--mute);
        display: block;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .list li {
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
      }
      .list li:last-child {
        border: 0;
      }
      .list em {
        color: var(--mute);
        font-size: 13px;
        font-style: normal;
        display: block;
      }
      .chips {
        margin: 10px 0 0;
      }
      .chip {
        display: inline-block;
        font-size: 12px;
        border: 1px solid var(--line);
        color: var(--mute);
        border-radius: 6px;
        padding: 1px 8px;
        margin: 0 6px 6px 0;
      }
      .fc .imp {
        background: var(--soft);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        margin: 10px 0;
      }
      .fc ul {
        padding-left: 18px;
        margin: 6px 0;
        font-size: 14px;
      }
      .fc li {
        margin: 3px 0;
      }
      .fc h3 {
        margin: 6px 0 0;
        font-size: 17px;
      }
      .tag {
        display: inline-block;
        background: var(--soft);
        color: var(--brand);
        font-size: 12px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 99px;
        margin-right: 6px;
      }
      footer {
        text-align: center;
        color: var(--mute);
        font-size: 13px;
        padding: 40px 20px;
      }
      #err {
        padding: 40px;
        text-align: center;
        color: #b00020;
      }

      .rv {
        opacity: 0;
        transform: translateY(24px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
        transition-delay: var(--d, 0s);
      }
      .rv.in {
        opacity: 1;
        transform: none;
      }
      .bar i {
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s;
      }
      .in .bar i,
      .bar.in i {
        transform: scaleX(1);
      }
      header .wrap > * {
        animation: up 0.8s ease both;
      }
      header .wrap > div:last-child {
        animation-delay: 0.15s;
      }
      .avatar {
        animation:
          pop 0.8s cubic-bezier(0.3, 1.5, 0.5, 1) both,
          pulse 3s ease-in-out 1s infinite;
      }
      header {
        background-size: 200% 200%;
        animation: flow 14s ease infinite;
      }
      .btn {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      }
      .stat,
      .card {
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .stat:hover,
      .job.card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
      }
      .job:before {
        transition: transform 0.3s;
      }
      .job:hover:before {
        transform: scale(1.5);
      }
      .tl {
        background: linear-gradient(var(--accent), var(--accent)) no-repeat -2px
          0/2px var(--p, 0%);
        border-left-color: var(--line);
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.4);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 12px rgba(224, 122, 31, 0);
        }
        0% {
          box-shadow: 0 0 0 0 rgba(224, 122, 31, 0.5);
        }
      }
      @keyframes flow {
        50% {
          background-position: 100% 50%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before {
          animation: none !important;
          transition: none !important;
        }
        .rv {
          opacity: 1;
          transform: none;
        }
        .bar i {
          transform: none;
        }
      }
      @media print {
        nav,
        .cta {
          display: none;
        }
      }
    </style>
  </head>

    <nav id="nav">
      <a href="#experience">Experience</a><a href="#featured">On-Going Projects</a
      ><a href="#skills">Skills</a><a href="#projects">Projects</a
      ><a href="#credentials">Credentials</a
      ><a href="#recognition">Recognition</a>
    </nav>
    <header>
      <div class="wrap">
        <img
          class="avatar"
          id="av"
          src="assets/img/profile-img.jpg"
          alt="Dr. Renel Jay Quirit"
        />
        <div>
          <h1 id="name"></h1>
          <div class="role" id="role"></div>
          <p id="sum"></p>
          <div class="cta" id="cta"></div>
        </div>
      </div>
    </header>
    <main class="wrap">
      <div class="stats" id="stats"></div>
      <section id="experience">
        <h2>Experience</h2>
        <div class="tl" id="exp"></div>
      </section>
      <section id="featured">
        <h2>On-Going Projects</h2>
        <div class="grid" id="ft"></div>
      </section>
      <section id="skills">
        <h2>Skills</h2>
        <div class="grid" id="sk"></div>
      </section>
      <section id="projects">
        <h2>Systems I Built &amp; Run</h2>
        <div class="grid" id="pr"></div>
      </section>
      <section id="credentials">
        <h2>Education &amp; Certifications</h2>
        <div class="grid">
          <div class="card">
            <h4>Education</h4>
            <ul class="list" id="ed"></ul>
          </div>
          <div class="card">
            <h4>Certifications</h4>
            <ul class="list" id="ce"></ul>
          </div>
        </div>
      </section>
      <section id="recognition">
        <h2>Recognition, Speaking &amp; Research</h2>
        <div class="grid">
          <div class="card">
            <h4>Awards</h4>
            <ul class="list" id="aw"></ul>
          </div>
          <div class="card">
            <h4>Speaking</h4>
            <ul class="list" id="sp"></ul>
          </div>
          <div class="card">
            <h4>Research</h4>
            <ul class="list" id="re"></ul>
          </div>
        </div>
      </section>
    </main>
    <footer id="foot"></footer>

lZXRzL3NoZWV0MTEueG1sUEsBAhQDFAAAAAgA7m1CXcGE/fe1AgAAqQsAAA0AAAAAAAAAAAAAAIABQzoAAHhsL3N0eWxlcy54bWxQSwECFAMUAAAACADubUJdl4q7HMAAAAATAgAACwAAAAAAAAAAAAAAgAEjPQAAX3JlbHMvLnJlbHNQSwECFAMUAAAACADubUJd2iVPEsgBAADBBwAADwAAAAAAAAAAAAAAgAEMPgAAeGwvd29ya2Jvb2sueG1sUEsBAhQDFAAAAAgA7m1CXXBSkOvsAAAAqAcAABoAAAAAAAAAAAAAAIABAUAAAHhsL19yZWxzL3dvcmtib29rLnhtbC5yZWxzUEsBAhQDFAAAAAgA7m1CXXHmRsxBAQAAIQkAABMAAAAAAAAAAAAAAIABJUEAAFtDb250ZW50X1R5cGVzXS54bWxQSwUGAAAAABMAEwD8BAAAl0IAAAAA";
      const $ = (id) => document.getElementById(id);
      function h(tag, props, kids) {
        const e = document.createElement(tag);
        for (const k in props || {}) {
          if (k === "text") e.textContent = props[k];
          else e.setAttribute(k, props[k]);
        }
        (kids || []).forEach((c) => e.appendChild(c));
        return e;
      }
      function rows(wb, n) {
        return XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: "" });
      }
      function li(t, sub, tag) {
        const e = h("li", {}, []);
        if (tag) e.appendChild(h("span", { class: "tag", text: tag }));
        e.appendChild(document.createTextNode(t));
        if (sub) e.appendChild(h("em", { text: sub }));
        return e;
      }
      function base64ToArrayBuffer(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
      }
      async function loadWorkbook() {
        try {
          const response = await fetch("resume_data.xlsx");
          if (!response.ok) {
            throw new Error(
              "Could not load resume_data.xlsx: " + response.status,
            );
          }
          return XLSX.read(await response.arrayBuffer(), { type: "array" });
        } catch (error) {
          if (XLSX_B64) {
            return XLSX.read(base64ToArrayBuffer(XLSX_B64), { type: "array" });
          }
          throw error;
        }
      }
      // Load the workbook and render the resume sections.
      (async () => {
        try {
          const wb = await loadWorkbook();
          const P = {};
          rows(wb, "Profile").forEach((r) => (P[r.Field] = r.Value));
          $("name").textContent = P.Name;
          $("role").textContent =
            P.Title + " · " + P.Tagline.split(" · ").slice(0, 3).join(" · ");
          $("sum").textContent = P.Summary;
          [
            ["Email me", "mailto:" + P.Email, ""],
            ["LinkedIn", P.LinkedIn, " o"],
            ["Portfolio", P.Website, " o"],
          ].forEach((a) =>
            $("cta").appendChild(
              h("a", {
                class: "btn" + a[2],
                href: a[1],
                target: "_blank",
                rel: "noopener",
                text: a[0],
              }),
            ),
          );
          rows(wb, "Stats").forEach((s) =>
            $("stats").appendChild(
              h("div", { class: "stat" }, [
                h("b", { text: String(s.Value) }),
                h("span", { text: s.Label }),
              ]),
            ),
          );
          rows(wb, "Experience").forEach((j) => {
            const ul = h(
              "ul",
              {},
              String(j["Highlights (| separated)"])
                .split("|")
                .map((t) => h("li", { text: t })),
            );
            $("exp").appendChild(
              h("div", { class: "job card" }, [
                h("h3", { text: j.Role }),
                h("div", { class: "org", text: j.Organization }),
                h("div", {
                  class: "meta",
                  text: j.Start + " – " + j.End + " · " + j.Location,
                }),
                ul,
              ]),
            );
          });
          const cats = {};
          rows(wb, "Skills").forEach((s) =>
            (cats[s.Category] = cats[s.Category] || []).push(s),
          );
          Object.keys(cats).forEach((c) => {
            const card = h("div", { class: "card" }, [h("h4", { text: c })]);
            cats[c].forEach((s) =>
              card.appendChild(
                h("div", { class: "skill" }, [
                  h("div", {}, [
                    h("span", { text: s.Skill }),
                    h("span", { text: s.Level + "/5" }),
                  ]),
                  h("div", { class: "bar" }, [
                    h("i", { style: "width:" + s.Level * 20 + "%" }),
                  ]),
                ]),
              ),
            );
            $("sk").appendChild(card);
          });
          rows(wb, "Accomplishments2026").forEach((a) => {
            const c = h("div", { class: "card fc" }, [
              h("span", { class: "tag", text: a.Domain }),
              h("h3", { text: a.Title }),
              h("div", { class: "imp", text: a["Scale / Impact"] }),
              h(
                "ul",
                {},
                String(a["Highlights (| separated)"])
                  .split("|")
                  .map((x) => h("li", { text: x })),
              ),
              h(
                "div",
                { class: "chips" },
                String(a.Technology)
                  .split(",")
                  .map((x) => h("span", { class: "chip", text: x.trim() })),
              ),
            ]);
            $("ft").appendChild(c);
          });
          rows(wb, "Projects").forEach((p) =>
            $("pr").appendChild(
              h(
                "a",
                {
                  class: "card proj",
                  href: p.URL,
                  target: "_blank",
                  rel: "noopener",
                },
                [
                  h("b", { text: p.Name }),
                  h("small", { text: p.Description }),
                  h("small", { text: p.URL.replace("https://", "") }),
                ],
              ),
            ),
          );
          rows(wb, "Education").forEach((e) =>
            $("ed").appendChild(
              li(e.Degree + " – " + e.School, e.Years + " · " + e.Note),
            ),
          );
          rows(wb, "Certifications").forEach((e) =>
            $("ce").appendChild(li(e.Name, e.Issuer + " · " + e.Year)),
          );
          rows(wb, "Awards").forEach((e) =>
            $("aw").appendChild(li(e.Award, e.Body, String(e.Year))),
          );
          rows(wb, "Speaking").forEach((e) =>
            $("sp").appendChild(li(e.Topic, e.Venue + " · " + e.Date)),
          );
          rows(wb, "Research").forEach((e) =>
            $("re").appendChild(li(e.Title, e.Venue + " · " + e.Year)),
          );
          $("foot").textContent =
            P.Location +
            " · " +
            P.Phone +
            " · " + P.Email;
          // Reveal cards, stats, and section headings as they enter the viewport.
          const io = new IntersectionObserver(
            (es) =>
              es.forEach((e) => {
                if (e.isIntersecting) {
                  e.target.classList.add("in");
                  io.unobserve(e.target);
                }
              }),
            { threshold: 0.12 },
          );
          document
            .querySelectorAll(".card,.stat,section>h2")
            .forEach((e, i) => {
              e.classList.add("rv");
              e.style.setProperty("--d", (i % 4) * 0.08 + "s");
              io.observe(e);
            });
          document.querySelectorAll(".stat b").forEach((b) => {
            const m = b.textContent.match(/^(\D*)([\d.]+)(.*)$/);
            if (!m) return;
            const n = parseFloat(m[2]),
              d = (m[2].split(".")[1] || "").length;
            const so = new IntersectionObserver(([e]) => {
              if (!e.isIntersecting) return;
              so.disconnect();
              const s = performance.now();
              (function f(now) {
                const p = Math.min((now - s) / 1400, 1),
                  v = n * (1 - Math.pow(1 - p, 3));
                b.textContent = m[1] + v.toFixed(d) + m[3];
                if (p < 1) requestAnimationFrame(f);
              })(s);
            });
            so.observe(b);
          });
          // Update the experience timeline's progress indicator on scroll.
          const tl = $("exp");
          addEventListener(
            "scroll",
            () => {
              const r = tl.getBoundingClientRect();
              tl.style.setProperty(
                "--p",
                Math.max(
                  0,
                  Math.min(100, ((innerHeight * 0.7 - r.top) / r.height) * 100),
                ) + "%",
              );
            },
            { passive: true },
          );
        } catch (err) {
          document.querySelector("main").innerHTML =
            '<div id="err">Could not load resume data.</div>';
          console.error(err);
        }
      })();
    </script>
